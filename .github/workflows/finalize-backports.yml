name: Finalize poll backports

on:
  push:
    branches:
      - backports-finalize

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded poll backport patch
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/finalize_backports.py
          python /tmp/finalize_backports.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DSharpPlus/DSharpPlus.csproj

      - name: Build patched DSharpPlus
        run: dotnet build DSharpPlus/DSharpPlus.csproj --configuration Release --no-restore

      - name: Commit validated patch and remove temporary workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-backports.yml
          git add DSharpPlus/Clients/DiscordClient.Dispatch.cs DSharpPlus/Clients/DiscordClient.Polls.cs UNICORD_BACKPORTS.md
          git commit -m "feat: complete poll update backport (ChatGPT)"
          git push origin HEAD:backports-finalize
