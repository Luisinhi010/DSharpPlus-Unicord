name: Finalize poll backports

on:
  push:
    branches:
      - backports-finalize

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded poll backport patch
        shell: python
        run: |
          from pathlib import Path

          dispatcher = Path("DSharpPlus/Clients/DiscordClient.Dispatch.cs")
          text = dispatcher.read_text(encoding="utf-8-sig")

          vote_anchor = '''                    case "message_delete_bulk":
                        await this.OnMessageBulkDeleteEventAsync(dat["ids"].ToDiscordObject<ulong[]>(), (ulong)dat["channel_id"], (ulong?)dat["guild_id"]).ConfigureAwait(false);
                        break;

                    #endregion

                    #region Message Reaction
'''
          vote_replacement = '''                    case "message_delete_bulk":
                        await this.OnMessageBulkDeleteEventAsync(dat["ids"].ToDiscordObject<ulong[]>(), (ulong)dat["channel_id"], (ulong?)dat["guild_id"]).ConfigureAwait(false);
                        break;

                    case "message_poll_vote_add":
                        await this.OnMessagePollVoteUpdateAsync(dat, true).ConfigureAwait(false);
                        break;

                    case "message_poll_vote_remove":
                        await this.OnMessagePollVoteUpdateAsync(dat, false).ConfigureAwait(false);
                        break;

                    #endregion

                    #region Message Reaction
'''
          if text.count(vote_anchor) != 1:
              raise SystemExit("Expected exactly one message-delete-bulk dispatch anchor")
          text = text.replace(vote_anchor, vote_replacement, 1)

          update_anchor = '''                message.Pinned = event_message.Pinned;
                message.IsTTS = event_message.IsTTS;

                // Mentions
'''
          update_replacement = '''                message.Pinned = event_message.Pinned;
                message.IsTTS = event_message.IsTTS;

                // MESSAGE_UPDATE payloads are partial. Preserve the cached poll when
                // the field is omitted, but replace it when Discord supplies a newer
                // poll object (for example when results/finalization change).
                if (event_message.Poll != null)
                    message.Poll = event_message.Poll;

                // Mentions
'''
          if text.count(update_anchor) != 1:
              raise SystemExit("Expected exactly one cached-message update anchor")
          text = text.replace(update_anchor, update_replacement, 1)
          dispatcher.write_text(text, encoding="utf-8")

          polls = Path("DSharpPlus/Clients/DiscordClient.Polls.cs")
          polls.write_text('''using System.Linq;
using System.Threading.Tasks;
using DSharpPlus.AsyncEvents;
using DSharpPlus.Entities;
using DSharpPlus.EventArgs;
using Newtonsoft.Json;
using Newtonsoft.Json.Linq;

namespace DSharpPlus
{
    public sealed partial class DiscordClient
    {
        private AsyncEvent<DiscordClient, MessagePollVotedEventArgs> _messagePollVoted;

        /// <summary>
        /// Fired when a vote is added to or removed from a poll.
        /// </summary>
        public event AsyncEventHandler<DiscordClient, MessagePollVotedEventArgs> MessagePollVoted
        {
            add
            {
                this.EnsurePollVoteEvent();
                this._messagePollVoted.Register(value);
            }
            remove => this._messagePollVoted?.Unregister(value);
        }

        private void EnsurePollVoteEvent()
        {
            this._messagePollVoted ??= new AsyncEvent<DiscordClient, MessagePollVotedEventArgs>(
                "MESSAGE_POLL_VOTED",
                this.EventErrorHandler);
        }

        /// <summary>
        /// Handles Discord's incremental poll vote gateway events.
        /// </summary>
        internal async Task OnMessagePollVoteUpdateAsync(JObject data, bool wasAdded)
        {
            if (data == null)
                return;

            DiscordPollVoteUpdate voteUpdate;
            try
            {
                voteUpdate = data.ToObject<DiscordPollVoteUpdate>();
            }
            catch (JsonException)
            {
                // A malformed gateway payload should not take down the dispatch loop.
                return;
            }

            if (voteUpdate == null)
                return;

            voteUpdate.WasAdded = wasAdded;
            voteUpdate.client = this;

            this.ApplyCachedPollVoteUpdate(voteUpdate);
            this.EnsurePollVoteEvent();

            await this._messagePollVoted.InvokeAsync(
                this,
                new MessagePollVotedEventArgs { PollVoteUpdate = voteUpdate })
                .ConfigureAwait(false);
        }

        private void ApplyCachedPollVoteUpdate(DiscordPollVoteUpdate voteUpdate)
        {
            var message = voteUpdate.Message;
            var results = message?.Poll?.Results?.Results;

            // Discord explicitly documents an omitted `results` object as unknown.
            // Do not manufacture a synthetic result set just because a vote event
            // arrived; preserve that distinction for callers.
            if (results == null)
                return;

            var answer = results.FirstOrDefault(result => result.AnswerId == voteUpdate.AnswerId);
            if (answer == null)
                return;

            if (voteUpdate.WasAdded)
                answer.Count++;
            else if (answer.Count > 0)
                answer.Count--;

            if (this.CurrentUser != null && voteUpdate.UserId == this.CurrentUser.Id)
                answer.SelfVoted = voteUpdate.WasAdded;
        }
    }
}
''', encoding="utf-8")

          docs = Path("UNICORD_BACKPORTS.md")
          d = docs.read_text(encoding="utf-8")
          old = '''The legacy Unicord dispatcher predates those event names and routes them through `UnknownEvent`. To avoid replacing the large legacy dispatch file in this first backport, `DiscordClient.Polls.cs` installs a narrow compatibility bridge when something subscribes to `MessagePollVoted`.

Only those two exact event names are converted.

```text
Gateway
  -> UnknownEvent (legacy dispatcher)
  -> poll bridge
  -> DiscordPollVoteUpdate
  -> MessagePollVoted
```

The bridge never performs a REST request. If the associated poll message and its result set are already cached, the affected answer count is updated in place. If results are unknown, the bridge leaves them unknown instead of manufacturing state.

This bridge is intentionally temporary. A future cleanup can add the two event names directly to `DiscordClient.Dispatch.cs` and remove the compatibility layer.
'''
          new = '''The legacy dispatcher now recognizes those two event names directly and forwards them to the typed poll handler in `DiscordClient.Polls.cs`.

```text
Gateway
  -> DiscordClient.Dispatch
  -> DiscordPollVoteUpdate
  -> cached poll delta (when known)
  -> MessagePollVoted
```

No REST request is performed. If the associated poll message and its result set are already cached, the affected answer count is updated in place. If results are unknown, they remain unknown instead of manufacturing state.

`MESSAGE_UPDATE` also merges a supplied `poll` object into the cached message. Because Discord message-update payloads are partial, an omitted `poll` field preserves the existing cached poll instead of clearing it.
'''
          if d.count(old) != 1:
              raise SystemExit("Expected exactly one legacy poll bridge documentation block")
          d = d.replace(old, new, 1)
          d = d.replace('''4. eventually moving the poll vote cases into the main gateway dispatcher when that file is cleaned up.\n''', '''4. rendering poll-result system messages cleanly in the Unicord message renderer.\n''')
          docs.write_text(d, encoding="utf-8")

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DSharpPlus/DSharpPlus.csproj

      - name: Build patched DSharpPlus
        run: dotnet build DSharpPlus/DSharpPlus.csproj --configuration Release --no-restore

      - name: Commit validated patch and remove temporary workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-backports.yml
          git add DSharpPlus/Clients/DiscordClient.Dispatch.cs DSharpPlus/Clients/DiscordClient.Polls.cs UNICORD_BACKPORTS.md
          git commit -m "feat: complete poll update backport (ChatGPT)"
          git push origin HEAD:backports-finalize
